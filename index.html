<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>점프 타이밍 게임</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-wrap">
    <h1>점프 타이밍 게임</h1>

    <div class="info">
      <p>점수: <span id="score">0</span></p>
      <p>목표: 10점</p>
    </div>

    <div id="game">
      <div id="player"></div>
      <div id="obstacle"></div>
      <div id="ground"></div>
    </div>

    <p id="message">스페이스바 또는 화면 클릭으로 점프하세요!</p>
    <button id="restartBtn">다시 시작</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
