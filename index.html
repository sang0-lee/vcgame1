<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>낙하물 받기 게임</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-wrap">
    <h1>낙하물 받기 게임</h1>

    <div class="info">
      <p>점수: <span id="score">0</span> / 20</p>
      <p>놓친 개수: <span id="miss">0</span> / 3</p>
    </div>

    <div id="game">
      <div id="basket"></div>
      <div id="item"></div>
    </div>

    <p id="message">
      ← → 방향키로 바구니를 움직여 낙하물을 받으세요!
    </p>

    <button id="restartBtn">다시 시작</button>
  </div>

  <script src="script.js"></script>

</body>
</html>
