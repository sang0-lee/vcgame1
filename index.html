<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>낙하물 받기 게임</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-wrap">
    <h1>낙하물 받기 게임</h1>

    <div class="info">
      <p>점수: <span id="score">0</span> / 20</p>
      <p>놓친 개수: <span id="miss">0</span> / 3</p>
      <p>단계: <span id="level">1</span></p>
    </div>

    <div id="game">
      <div id="startScreen">
        <h2>낙하물 받기</h2>
        <p>← → 방향키로 바구니를 움직이세요.</p>
        <p>점수가 오를수록 1단계 → 2단계 → 3단계로 어려워집니다.</p>
        <button id="startBtn">게임 시작</button>
      </div>

      <div id="basket"></div>
      <div id="item"></div>
    </div>

    <p id="message">
      게임 시작 버튼을 눌러주세요!
    </p>

    <div id="nameBox" class="hidden">
      <input id="nicknameInput" type="text" placeholder="닉네임 입력">
      <button id="saveRankBtn">기록 저장</button>
    </div>

    <button id="restartBtn">다시 시작</button>

    <div class="ranking-box">
      <h2>플레이 로그</h2>
      <ul id="rankingList"></ul>
    </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
